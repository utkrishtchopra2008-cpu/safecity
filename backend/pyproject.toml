[project]
name = "safecity-backend"
version = "0.1.0"
description = "FastAPI foundation for the SafeCity AI incident intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.156.4",
  "httpx==0.28.1",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic==2.14.1",
  "sqlalchemy==2.0.55",
  "uvicorn[standard]==0.48.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2.0",
  "pytest==9.1.1",
  "ruff==0.15.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
