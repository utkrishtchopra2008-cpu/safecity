name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check formatting
        working-directory: frontend
        run: |
          if npm run format:check; then
            exit 0
          fi
          npx prettier --config ../.prettierrc.json --ignore-path ../.prettierignore --write index.html src/api/client.test.ts src/api/client.ts src/components/AppShell.tsx src/pages/NotFoundPage.tsx src/pages/SetupStatusPage.tsx src/styles/tokens.css
          echo "=== TEMPORARY PRETTIER SOURCE DUMP ==="
          for file in index.html src/api/client.test.ts src/api/client.ts src/components/AppShell.tsx src/pages/NotFoundPage.tsx src/pages/SetupStatusPage.tsx src/styles/tokens.css; do
            echo "===== $file ====="
            cat "$file"
          done
          exit 1
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test:run
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests migrations
      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check app tests migrations
      - name: Typecheck
        working-directory: backend
        run: uv run mypy app
      - name: Test
        working-directory: backend
        run: uv run pytest
